<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Unic Elevators – Staff</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Barlow+Condensed:wght@900&display=swap" rel="stylesheet">
<style>
:root{--r:#9B1111;--g:#F0A500;--n:#060d1f;--n2:#0d1628;--tx:#f0f4ff;--t2:#a8b4cf;--br:rgba(255,255,255,0.08);--blue:#4285F4;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--n);color:var(--tx);font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden}
.screen{display:none;padding:20px;min-height:100vh}
.screen.active{display:block}
header{padding:15px 20px;background:rgba(6,13,31,0.95);border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.btn-back{background:var(--n2);border:1px solid var(--br);color:var(--tx);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:var(--g);letter-spacing:1px}
.card{background:var(--n2);border:1px solid var(--br);border-radius:16px;padding:20px;margin-bottom:15px}
.btn-main{width:100%;padding:16px;border-radius:12px;border:none;font-weight:700;cursor:pointer;margin-bottom:12px;font-size:16px;transition:.2s}
.btn-primary{background:var(--r);color:white}
.btn-outline{background:var(--n2);color:var(--tx);border:1px solid var(--br)}
input,textarea,select{width:100%;padding:12px;background:var(--n);border:1px solid var(--br);border-radius:8px;color:white;margin-bottom:15px;font-size:16px;font-family:inherit}
select option{background:var(--n2)}
label{font-size:12px;color:var(--t2);display:block;margin-bottom:4px}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:bold;text-transform:uppercase}
.st-pending{background:rgba(255,255,255,0.1);color:white}
.st-assigned{background:rgba(66,133,244,0.2);color:var(--blue)}
.st-reached{background:rgba(240,165,0,0.2);color:var(--g)}
.st-completed{background:rgba(34,197,94,0.2);color:var(--green)}
.sync-bar{font-size:11px;text-align:center;padding:8px 10px;background:rgba(66,133,244,0.1);color:var(--blue);border-radius:8px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.conn-dot.live{background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{flex:1;padding:10px;border-radius:8px;border:1px solid var(--br);background:var(--n2);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.tab.active{background:var(--r);color:white;border-color:var(--r)}
.tab-badge{display:inline-block;background:rgba(255,255,255,0.25);border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px}
.filter-bar{background:var(--n2);border:1px solid var(--br);border-radius:10px;padding:12px;margin-bottom:12px}
.filter-bar label{font-size:11px;color:var(--t2);margin-bottom:4px}
.filter-bar select,.filter-bar input{margin-bottom:0;padding:8px;font-size:13px}
.filter-row{display:flex;gap:8px;align-items:flex-end}
.filter-row>div{flex:1}
.filter-row button{flex-shrink:0;padding:8px 14px;border-radius:8px;border:none;background:var(--blue);color:white;font-weight:700;font-size:12px;cursor:pointer;height:38px}
.search-row{margin-top:10px}
.search-row input{margin-bottom:0;padding:8px 10px;font-size:13px}
.empty{text-align:center;padding:40px 20px;color:var(--t2);font-size:14px}
#loader{position:fixed;inset:0;background:rgba(6,13,31,0.9);display:none;align-items:center;justify-content:center;z-index:2000;flex-direction:column}
.spinner{width:40px;height:40px;border:4px solid var(--g);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
.conn-dot.offline{background:#ff6b6b}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="spinner"></div>
  <p style="margin-top:14px;font-size:13px;color:var(--t2)">Updating...</p>
</div>

<!-- HEADER -->
<header id="main-header" style="display:none">
  <button class="btn-back" id="back-btn" onclick="navBack()">← BACK</button>
  <span class="logo">UNIC ELEVATORS</span>
  <span id="user-tag" style="font-size:11px;color:var(--t2)"></span>
</header>

<!-- SCREEN: LANGUAGE -->
<div class="screen active" id="scr-lang" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh">
  <div style="font-size:60px;margin-bottom:16px">🔧</div>
  <div class="logo" style="font-size:28px;margin-bottom:6px">UNIC ELEVATORS</div>
  <p style="color:var(--t2);margin-bottom:40px;font-size:14px">Staff Panel</p>
  <p style="color:var(--t2);font-size:13px;margin-bottom:20px">Choose Language / భాష ఎంచుకోండి</p>
  <button class="btn-main btn-primary" style="max-width:300px" onclick="setLang('en')">🇬🇧 ENGLISH</button>
  <button class="btn-main btn-outline" style="max-width:300px" onclick="setLang('te')">🇮🇳 తెలుగు</button>
</div>

<!-- SCREEN: ROLE SELECT -->
<div class="screen" id="scr-role">
  <div style="text-align:center;padding:30px 0 20px">
    <div style="font-size:40px">🔐</div>
    <h2 style="margin-top:10px">Staff Login</h2>
    <p style="color:var(--t2);font-size:13px;margin-top:6px">Select your role to continue</p>
  </div>
  <button class="btn-main btn-outline" onclick="openLogin('tech')">👷 Technician Login</button>
  <button class="btn-main btn-primary" onclick="openLogin('admin')">🛡️ Admin Panel Login</button>
</div>

<!-- SCREEN: LOGIN -->
<div class="screen" id="scr-login">
  <div class="card" style="margin-bottom:20px">
    <h2 id="login-title">Login</h2>
  </div>
  <label>Your Name</label>
  <input id="login-name" type="text" autocomplete="name">
  <label>Password</label>
  <input id="login-pass" type="password" onkeydown="if(event.key==='Enter') handleLogin()">
  <div id="login-err" style="color:#ff6b6b;font-size:13px;margin-bottom:12px;display:none">❌ Incorrect password. Try again.</div>
  <button class="btn-main btn-primary" onclick="handleLogin()">🔓 Login</button>
</div>

<!-- SCREEN: TECHNICIAN -->
<div class="screen" id="scr-tech">
  <div style="font-size:11px;color:var(--t2);margin-bottom:8px" id="tech-user-tag"></div>
  <div class="sync-bar" id="tech-sync-bar">
    <div class="conn-dot live" id="tech-conn-dot"></div>
    <span id="tech-sync-msg">🟢 Live — real-time updates on</span>
  </div>
  <div class="filter-bar">
    <div class="filter-row">
      <div>
        <label>Show</label>
        <select id="tech-filter" onchange="renderTech()">
          <option value="active">Active Only</option>
          <option value="all">All Time</option>
        </select>
      </div>
    </div>
    <div class="search-row">
      <label>Search</label>
      <input id="tech-search" type="text" placeholder="Name, ID or phone..." oninput="renderTech()">
    </div>
  </div>
  <div id="tech-list"></div>
</div>

<!-- SCREEN: ADMIN -->
<div class="screen" id="scr-admin">
  <div style="font-size:11px;color:var(--t2);margin-bottom:8px" id="admin-user-tag"></div>
  <div class="sync-bar" id="admin-sync-bar">
    <div class="conn-dot live" id="admin-conn-dot"></div>
    <span id="admin-sync-msg">🟢 Live — real-time updates on</span>
  </div>

  <!-- Stats -->
  <div style="display:flex;gap:10px;margin-bottom:16px">
    <div class="card" style="flex:1;text-align:center;padding:14px;margin-bottom:0">
      <div id="stat-active" style="font-size:24px;font-weight:900;color:var(--blue)">0</div>
      <div style="font-size:10px;color:var(--t2);margin-top:2px">Active</div>
    </div>
    <div class="card" style="flex:1;text-align:center;padding:14px;margin-bottom:0">
      <div id="stat-done" style="font-size:24px;font-weight:900;color:var(--green)">0</div>
      <div style="font-size:10px;color:var(--t2);margin-top:2px">Done</div>
    </div>
    <div class="card" style="flex:1;text-align:center;padding:14px;margin-bottom:0">
      <div id="stat-all" style="font-size:24px;font-weight:900;color:var(--g)">0</div>
      <div style="font-size:10px;color:var(--t2);margin-top:2px">All</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tab-active" onclick="setAdminTab('active')">Active <span class="tab-badge" id="tbadge-active">0</span></div>
    <div class="tab" id="tab-done" onclick="setAdminTab('done')">Done <span class="tab-badge" id="tbadge-done">0</span></div>
    <div class="tab" id="tab-all" onclick="setAdminTab('all')">All <span class="tab-badge" id="tbadge-all">0</span></div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <div class="filter-row">
      <div>
        <label>Date range</label>
        <select id="admin-date" onchange="renderAdmin()">
          <option value="7">Last 7 Days</option>
          <option value="30">Last 30 Days</option>
          <option value="all">All Time</option>
        </select>
      </div>
    </div>
    <div class="search-row">
      <label>Search</label>
      <input id="admin-search" type="text" placeholder="Name, ID or phone..." oninput="renderAdmin()">
    </div>
  </div>

  <div id="admin-list"></div>
</div>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ══════════════════════════════════════════════════════
   FIREBASE INIT
══════════════════════════════════════════════════════ */
if (!firebase.apps.length) {
  firebase.initializeApp({
    apiKey: "AIzaSyA8Ge3WFWVJiLEoNJnmlStgThzA70eixAU",
    authDomain: "unic-elevators-2c01c.firebaseapp.com",
    databaseURL: "https://unic-elevators-2c01c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "unic-elevators-2c01c",
    storageBucket: "unic-elevators-2c01c.firebasestorage.app",
    messagingSenderId: "1002807153207",
    appId: "1:1002807153207:web:a697e2ed1faa95d71165b2"
  });
}

var dbRoot = firebase.database().ref("tickets");

/* ── STATE ── */
var LANG = 'en';
var HISTORY = ['scr-lang'];
var LOGIN_ROLE = '';
var CURRENT_USER = '';
var ALL_TICKETS = [];        // Admin: all tickets
var TECH_TICKETS = [];       // Tech: only this user's assigned tickets
var ADMIN_TAB = 'active';
var PROTECTED = ['scr-tech', 'scr-admin'];

// ✅ FIX: Separate listener references for tech vs admin so we can properly detach
var adminListenerRef = null;
var adminListenerFn = null;
var techListenerRef = null;
var techListenerFn = null;

/* ══════════════════════════════════════════════════════
   ✅ FIX 3: Separate filtered listeners for tech & admin
   Tech  → orderByChild("assignedTo").equalTo(name) — only their tickets
   Admin → full db.on("value") — all tickets
   ✅ FIX 4: Always call stopListeners() before attaching new ones
   ✅ FIX 6: Error handler shows offline state in UI
══════════════════════════════════════════════════════ */

function startTechListener() {
  stopAllListeners();

  // ✅ FIX 3: Filtered — only tickets assigned to THIS technician
  techListenerRef = firebase.database().ref("tickets")
    .orderByChild("assignedTo")
    .equalTo(CURRENT_USER);

  techListenerFn = techListenerRef.on("value", function(snap) {
    TECH_TICKETS = [];
    snap.forEach(function(child) {
      var t = child.val(); t._key = child.key;
      TECH_TICKETS.push(t);
    });
    setConnStatus('tech', true);
    renderTech();
  }, function(err) {
    // ✅ FIX 6: Show offline indicator
    setConnStatus('tech', false);
    document.getElementById('tech-list').innerHTML =
      '<div class="empty" style="color:#ff6b6b">⚠️ Connection error. Check your internet.<br><small style="color:var(--t2)">' + err.message + '</small></div>';
  });
}

function startAdminListener() {
  stopAllListeners();

  // Admin needs all tickets for stats & management
  adminListenerRef = firebase.database().ref("tickets");
  adminListenerFn = adminListenerRef.on("value", function(snap) {
    ALL_TICKETS = [];
    snap.forEach(function(child) {
      var t = child.val(); t._key = child.key;
      ALL_TICKETS.push(t);
    });
    setConnStatus('admin', true);
    renderAdmin();
  }, function(err) {
    // ✅ FIX 6: Show offline indicator
    setConnStatus('admin', false);
    document.getElementById('admin-list').innerHTML =
      '<div class="empty" style="color:#ff6b6b">⚠️ Connection error. Check your internet.<br><small style="color:var(--t2)">' + err.message + '</small></div>';
  });
}

/* ✅ FIX 4: Cleanly detach all listeners before attaching new ones */
function stopAllListeners() {
  if (techListenerRef && techListenerFn) {
    techListenerRef.off("value", techListenerFn);
    techListenerRef = null; techListenerFn = null;
  }
  if (adminListenerRef && adminListenerFn) {
    adminListenerRef.off("value", adminListenerFn);
    adminListenerRef = null; adminListenerFn = null;
  }
  TECH_TICKETS = [];
  ALL_TICKETS = [];
}

/* ── Connection status indicator ── */
function setConnStatus(role, online) {
  var dot = document.getElementById(role + '-conn-dot');
  var msg = document.getElementById(role + '-sync-msg');
  if (!dot || !msg) return;
  if (online) {
    dot.className = 'conn-dot live';
    msg.innerText = '🟢 Live — real-time updates on';
  } else {
    dot.className = 'conn-dot offline';
    msg.innerText = '🔴 Offline — reconnecting...';
  }
}

/* ── NAVIGATION ── */
function setLang(l) {
  LANG = l;
  gotoScreen('scr-role');
}

function gotoScreen(id) {
  HISTORY.push(id);
  showScreen(id);
}

function navBack() {
  var cur = HISTORY[HISTORY.length - 1];
  if (PROTECTED.indexOf(cur) !== -1) {
    // ✅ FIX 4: Stop all listeners on logout
    stopAllListeners();
    CURRENT_USER = '';
    document.getElementById('user-tag').innerText = '';
    HISTORY = ['scr-lang', 'scr-role'];
    showScreen('scr-role');
    return;
  }
  if (HISTORY.length > 1) {
    HISTORY.pop();
    showScreen(HISTORY[HISTORY.length - 1]);
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) {
    s.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
  var hdr = document.getElementById('main-header');
  var btn = document.getElementById('back-btn');
  hdr.style.display = (id === 'scr-lang') ? 'none' : 'flex';
  btn.textContent = PROTECTED.indexOf(id) !== -1 ? '🚪 LOGOUT' : '← BACK';

  // ✅ FIX 3+4: Start correct filtered listener when entering staff screens
  if (id === 'scr-tech') {
    document.getElementById('tech-list').innerHTML = '<div class="empty">📡 Connecting...</div>';
    startTechListener();
  }
  if (id === 'scr-admin') {
    document.getElementById('admin-list').innerHTML = '<div class="empty">📡 Connecting...</div>';
    startAdminListener();
  }
  window.scrollTo(0, 0);
}

/* ── LOGIN ── */
function openLogin(role) {
  LOGIN_ROLE = role;
  document.getElementById('login-err').style.display = 'none';
  document.getElementById('login-name').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-title').innerText = role === 'tech' ? '👷 Technician Login' : '🛡️ Admin Login';
  gotoScreen('scr-login');
}

function handleLogin() {
  var n = document.getElementById('login-name').value.trim();
  var p = document.getElementById('login-pass').value;
  if (!n) { alert('Enter your name'); return; }
  var ok = (LOGIN_ROLE === 'tech' && p === '1111') || (LOGIN_ROLE === 'admin' && p === '2222');
  if (ok) {
    CURRENT_USER = n;
    var tagId = LOGIN_ROLE === 'tech' ? 'tech-user-tag' : 'admin-user-tag';
    document.getElementById(tagId).innerText = '👤 ' + n;
    document.getElementById('user-tag').innerText = '👤 ' + n;
    HISTORY = ['scr-lang', 'scr-role'];
    gotoScreen('scr-' + LOGIN_ROLE);
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

/* ── HELPERS ── */
function sColor(status) {
  var c = { pending:'rgba(255,255,255,0.3)', assigned:'var(--blue)', reached:'var(--g)', completed:'var(--green)' };
  return c[status] || 'var(--br)';
}
function tBadge(type) {
  var b = { installation:'🏗 Install', service:'🔧 Service', emergency:'⚠️ Emergency' };
  return b[type] || type || '';
}
function toggleLoader(show) {
  document.getElementById('loader').style.display = show ? 'flex' : 'none';
}

/* ── RENDER TECHNICIAN LIST ── */
function renderTech() {
  var list = document.getElementById('tech-list');
  if (!list) return;

  var filter = (document.getElementById('tech-filter') || {}).value || 'active';
  var search = ((document.getElementById('tech-search') || {}).value || '').toLowerCase().trim();

  // ✅ FIX 3: TECH_TICKETS already pre-filtered by assignedTo via Firebase query
  // Just apply local UI filters (active/all and search)
  var tickets = TECH_TICKETS.filter(function(t) {
    if (filter === 'active') return t.status !== 'completed';
    return true;
  });

  if (search) {
    tickets = tickets.filter(function(t) {
      return (t.name && t.name.toLowerCase().includes(search))
        || (t.id && t.id.toString().includes(search))
        || (t.phone && t.phone.includes(search));
    });
  }

  tickets.sort(function(a, b) { return b.created - a.created; });

  if (!tickets.length) {
    list.innerHTML = '<div class="empty">📋 No assignments found</div>';
    return;
  }

  list.innerHTML = tickets.map(function(t) {
    var mapLink = t.lat ? '<a href="https://maps.google.com/?q=' + t.lat + ',' + t.lng + '" target="_blank" style="color:var(--blue);font-size:11px">📍 Open Map</a>' : '';
    var actionBtn = '';
    if (t.status === 'assigned') {
      actionBtn = '<button onclick="updateStatus(\'' + t._key + '\',\'reached\')" style="padding:9px 16px;border-radius:8px;border:none;background:rgba(240,165,0,0.2);color:var(--g);font-weight:700;font-size:13px;cursor:pointer;width:100%;margin-top:10px">✅ Mark as Reached</button>';
    } else if (t.status === 'reached') {
      actionBtn = '<button onclick="updateStatus(\'' + t._key + '\',\'completed\')" style="padding:9px 16px;border-radius:8px;border:none;background:rgba(34,197,94,0.2);color:var(--green);font-weight:700;font-size:13px;cursor:pointer;width:100%;margin-top:10px">🏁 Mark as Completed</button>';
    }
    return '<div class="card" style="border-left:4px solid ' + sColor(t.status) + '">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'
      + '<span style="font-size:11px;color:var(--t2)">ID: <b style="color:var(--g)">#' + t.id + '</b> · ' + tBadge(t.type) + '</span>'
      + '<span class="badge st-' + t.status + '">' + t.status.toUpperCase() + '</span>'
      + '</div>'
      + '<div style="font-weight:700;font-size:16px">' + t.name + '</div>'
      + '<div style="font-size:13px;color:var(--t2);margin:4px 0">📞 ' + t.phone + '</div>'
      + (t.addr ? '<div style="font-size:12px;color:var(--t2)">📍 ' + t.addr + '</div>' : '')
      + (t.issue ? '<div style="font-size:12px;color:var(--t2);font-style:italic;margin-top:4px">"' + t.issue + '"</div>' : '')
      + (mapLink ? '<div style="margin-top:8px">' + mapLink + '</div>' : '')
      + '<div style="font-size:10px;color:var(--t2);margin-top:8px">' + new Date(t.created).toLocaleString() + '</div>'
      + actionBtn
      + '</div>';
  }).join('');
}

/* ── RENDER ADMIN LIST ── */
function renderAdmin() {
  var list = document.getElementById('admin-list');
  if (!list) return;

  var dateFilter = (document.getElementById('admin-date') || {}).value || '7';
  var search = ((document.getElementById('admin-search') || {}).value || '').toLowerCase().trim();
  var now = Date.now();

  var filtered = ALL_TICKETS.filter(function(t) {
    if (dateFilter !== 'all') {
      var days = parseInt(dateFilter);
      if (now - t.created > days * 86400000) return false;
    }
    if (search) {
      return (t.name && t.name.toLowerCase().includes(search))
        || (t.id && t.id.toString().includes(search))
        || (t.phone && t.phone.includes(search))
        || (t.assignedTo && t.assignedTo.toLowerCase().includes(search));
    }
    return true;
  });

  var active = filtered.filter(function(t) { return t.status !== 'completed'; });
  var done   = filtered.filter(function(t) { return t.status === 'completed'; });

  var el;
  el = document.getElementById('stat-active'); if (el) el.innerText = ALL_TICKETS.filter(function(t){ return t.status !== 'completed'; }).length;
  el = document.getElementById('stat-done');   if (el) el.innerText = ALL_TICKETS.filter(function(t){ return t.status === 'completed'; }).length;
  el = document.getElementById('stat-all');    if (el) el.innerText = ALL_TICKETS.length;
  el = document.getElementById('tbadge-active'); if (el) el.innerText = active.length;
  el = document.getElementById('tbadge-done');   if (el) el.innerText = done.length;
  el = document.getElementById('tbadge-all');    if (el) el.innerText = filtered.length;

  var show = { active: active, done: done, all: filtered }[ADMIN_TAB] || filtered;
  show.sort(function(a, b) { return b.created - a.created; });

  if (!show.length) {
    list.innerHTML = '<div class="empty">📋 No tickets found</div>';
    return;
  }

  list.innerHTML = show.map(function(t) {
    var mapLink = t.lat ? '<a href="https://maps.google.com/?q=' + t.lat + ',' + t.lng + '" target="_blank" style="color:var(--blue);font-size:11px">📍 Map</a>' : '';
    var adminBtn = '';
    if (t.status === 'pending') {
      adminBtn = '<div style="margin-top:10px;display:flex;gap:8px;align-items:center">'
        + '<input id="tech-inp-' + t._key + '" type="text" placeholder="Technician name" style="margin:0;padding:8px;font-size:13px;flex:1">'
        + '<button onclick="assignTech(\'' + t._key + '\')" style="padding:8px 14px;border-radius:8px;border:none;background:rgba(66,133,244,0.2);color:var(--blue);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap">👷 Assign</button>'
        + '</div>';
    } else if (t.status !== 'completed') {
      adminBtn = '<button onclick="updateStatus(\'' + t._key + '\',\'completed\')" style="margin-top:10px;padding:8px 14px;border-radius:8px;border:none;background:rgba(34,197,94,0.15);color:var(--green);font-weight:700;font-size:12px;cursor:pointer">🏁 Mark Complete</button>';
    }
    return '<div class="card" style="border-left:4px solid ' + sColor(t.status) + '">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'
      + '<span style="font-size:11px;color:var(--t2)">#' + t.id + ' · ' + tBadge(t.type) + '</span>'
      + '<span class="badge st-' + t.status + '">' + t.status.toUpperCase() + '</span>'
      + '</div>'
      + '<div style="font-weight:700;font-size:15px">' + t.name + '</div>'
      + '<div style="font-size:12px;color:var(--t2);margin:4px 0">📞 ' + t.phone + '</div>'
      + (t.addr ? '<div style="font-size:11px;color:var(--t2)">📍 ' + t.addr + '</div>' : '')
      + (t.issue ? '<div style="font-size:11px;color:var(--t2);font-style:italic;margin-top:4px">"' + t.issue + '"</div>' : '')
      + (t.assignedTo ? '<div style="font-size:11px;margin-top:6px">👷 <b style="color:white">' + t.assignedTo + '</b></div>' : '')
      + (mapLink ? '<div style="margin-top:6px">' + mapLink + '</div>' : '')
      + adminBtn
      + '<div style="font-size:10px;color:var(--t2);margin-top:8px">' + new Date(t.created).toLocaleString() + '</div>'
      + '</div>';
  }).join('');
}

/* ── ADMIN TAB ── */
function setAdminTab(tab) {
  ADMIN_TAB = tab;
  ['active','done','all'].forEach(function(t) {
    var el = document.getElementById('tab-' + t);
    if (el) el.className = 'tab' + (t === tab ? ' active' : '');
  });
  renderAdmin();
}

/* ── ASSIGN TECH ── */
function assignTech(key) {
  var inp = document.getElementById('tech-inp-' + key);
  var name = inp ? inp.value.trim() : '';
  if (!name) { alert('Enter a technician name.'); return; }
  toggleLoader(true);
  dbRoot.child(key).update({ status: 'assigned', assignedTo: name })
    .then(function() { toggleLoader(false); })
    .catch(function(e) { toggleLoader(false); alert('Update failed: ' + e.message); });
}

/* ── UPDATE STATUS ── */
function updateStatus(key, newStatus) {
  toggleLoader(true);
  dbRoot.child(key).update({ status: newStatus })
    .then(function() { toggleLoader(false); })
    .catch(function(e) { toggleLoader(false); alert('Update failed: ' + e.message); });
}
</script>
</body>
</html>
