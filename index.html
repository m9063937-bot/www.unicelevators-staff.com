<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Unic Elevators – Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Noto+Sans+Telugu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--r:#9B1111;--g:#F0A500;--n:#060d1f;--n2:#0d1628;--tx:#f0f4ff;--t2:#a8b4cf;--br:rgba(255,255,255,0.08);--blue:#4285F4;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--n);color:var(--tx);font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden}
.screen{display:none;padding:20px;min-height:100vh}
.screen.active{display:block}
header{padding:15px 20px;background:rgba(6,13,31,0.95);border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.btn-back{background:var(--n2);border:1px solid var(--br);color:var(--tx);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:var(--g);letter-spacing:1px}
.card{background:var(--n2);border:1px solid var(--br);border-radius:16px;padding:20px;margin-bottom:15px}
.btn-main{width:100%;padding:16px;border-radius:12px;border:none;font-weight:700;cursor:pointer;margin-bottom:12px;font-size:16px;transition:.2s}
.btn-primary{background:var(--r);color:white}
.btn-outline{background:var(--n2);color:var(--tx);border:1px solid var(--br)}
input,textarea,select{width:100%;padding:12px;background:var(--n);border:1px solid var(--br);border-radius:8px;color:white;margin-bottom:15px;font-size:16px;font-family:inherit}
select option{background:var(--n2)}
label{font-size:12px;color:var(--t2);display:block;margin-bottom:4px}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:bold;text-transform:uppercase}
.st-pending{background:rgba(255,255,255,0.1);color:white}
.st-assigned{background:rgba(66,133,244,0.2);color:var(--blue)}
.st-reached{background:rgba(240,165,0,0.2);color:var(--g)}
.st-completed{background:rgba(34,197,94,0.2);color:var(--green)}
.sync-bar{font-size:11px;text-align:center;padding:8px 10px;background:rgba(66,133,244,0.1);color:var(--blue);border-radius:8px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.conn-dot.live{background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{flex:1;padding:10px;border-radius:8px;border:1px solid var(--br);background:var(--n2);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.tab.active{background:var(--r);color:white;border-color:var(--r)}
.tab-badge{display:inline-block;background:rgba(255,255,255,0.25);border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px}
.filter-bar{background:var(--n2);border:1px solid var(--br);border-radius:10px;padding:12px;margin-bottom:12px}
.filter-bar label{font-size:11px;color:var(--t2);margin-bottom:4px}
.filter-bar select,.filter-bar input{margin-bottom:0;padding:8px;font-size:13px}
.filter-row{display:flex;gap:8px;align-items:flex-end}
.filter-row>div{flex:1}
.filter-row button{flex-shrink:0;padding:8px 14px;border-radius:8px;border:none;background:var(--blue);color:white;font-weight:700;font-size:12px;cursor:pointer;height:38px}
.search-row{margin-top:10px}
.search-row input{margin-bottom:0;padding:8px 10px;font-size:13px}
.empty{text-align:center;padding:40px 20px;color:var(--t2);font-size:14px}
</style>

<!-- ✅ ChatGPT approach: Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>

<header id="main-header" style="display:none">
  <button class="btn-back" id="back-btn" onclick="navBack()">← BACK</button>
  <div class="logo">UNIC ELEVATORS</div>
  <div style="width:60px"></div>
</header>

<!-- ── LANGUAGE ── -->
<div id="scr-lang" class="screen active">
  <div style="text-align:center;margin-top:80px">
    <div style="font-size:60px;margin-bottom:16px">🔧</div>
    <h1 style="font-size:36px;color:var(--g);font-family:'Barlow Condensed'">UNIC ELEVATORS</h1>
    <p style="color:var(--t2);margin-bottom:8px;font-size:13px">Staff Panel</p>
    <p style="margin-bottom:40px;color:var(--t2)">Choose Language / భాష ఎంచుకోండి</p>
    <button class="btn-main btn-outline" onclick="setLang('en')">🇬🇧 ENGLISH</button>
    <button class="btn-main btn-outline" style="font-family:'Noto Sans Telugu'" onclick="setLang('te')">🇮🇳 తెలుగు</button>
  </div>
</div>

<!-- ── ROLE ── -->
<div id="scr-role" class="screen">
  <div style="text-align:center;margin-top:50px">
    <div style="font-size:48px;margin-bottom:12px">🔐</div>
    <h2>Staff Login</h2>
    <p style="color:var(--t2);font-size:13px;margin-top:6px;margin-bottom:30px">Select your role to continue</p>
    <button class="btn-main btn-outline" onclick="openLogin('tech')">👷 Technician Login</button>
    <button class="btn-main btn-primary" onclick="openLogin('admin')">🛡️ Admin Panel Login</button>
  </div>
</div>

<!-- ── LOGIN ── -->
<div id="scr-login" class="screen">
  <div class="card" style="max-width:400px;margin:40px auto">
    <h2 id="login-title">Login</h2>
    <div style="margin-top:20px">
      <label>Your Name</label>
      <input type="text" id="login-name" placeholder="Enter your full name">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="Enter password">
      <button class="btn-main btn-primary" onclick="handleLogin()">🔓 Login</button>
      <p id="login-err" style="color:#ff6b6b;text-align:center;display:none;font-size:13px">❌ Incorrect password. Try again.</p>
    </div>
  </div>
</div>

<!-- ── TECHNICIAN PANEL ── -->
<div id="scr-tech" class="screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h3>My Assignments</h3>
    <span id="tech-user-tag" style="font-size:12px;color:var(--g)"></span>
  </div>
  <div class="sync-bar">
    <span class="conn-dot live"></span>
    <span id="tech-sync-text">🟢 Live — real-time updates on</span>
  </div>
  <div class="filter-bar">
    <div class="filter-row">
      <div>
        <label>Show</label>
        <select id="tech-filter" onchange="renderTech()">
          <option value="active">Active Only</option>
          <option value="all">All Time</option>
        </select>
      </div>
    </div>
    <div class="search-row">
      <label>Search</label>
      <input type="text" id="tech-search" placeholder="Name, ID or phone" oninput="renderTech()">
    </div>
  </div>
  <div id="tech-list"></div>
</div>

<!-- ── ADMIN PANEL ── -->
<div id="scr-admin" class="screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h3>Admin Control</h3>
    <span id="admin-user-tag" style="font-size:12px;color:var(--g)"></span>
  </div>
  <div class="sync-bar">
    <span class="conn-dot live"></span>
    <span>🟢 Live — real-time updates on</span>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tab-active"    onclick="switchTab('active')">Active    <span class="tab-badge" id="badge-active">0</span></div>
    <div class="tab"        id="tab-completed" onclick="switchTab('completed')">Done   <span class="tab-badge" id="badge-completed">0</span></div>
    <div class="tab"        id="tab-all"       onclick="switchTab('all')">All          <span class="tab-badge" id="badge-all">0</span></div>
  </div>

  <!-- Stats -->
  <div id="admin-stats" style="display:flex;gap:8px;margin-bottom:12px"></div>

  <!-- Filters -->
  <div class="filter-bar">
    <div class="filter-row">
      <div>
        <label>Date range</label>
        <select id="admin-filter" onchange="renderAdmin()">
          <option value="7">Last 7 Days</option>
          <option value="30">Last 30 Days</option>
          <option value="all" selected>All Time</option>
        </select>
      </div>
    </div>
    <div class="search-row">
      <label>Search</label>
      <input type="text" id="admin-search" placeholder="Name, ID or phone" oninput="renderAdmin()">
    </div>
  </div>

  <div id="admin-list"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   FIREBASE — ChatGPT's working sync logic inside
   original Unic Elevators Staff UI and workflows
══════════════════════════════════════════════════════ */

// ✅ ChatGPT fix: guard against re-init
if (!firebase.apps.length) {
  firebase.initializeApp({
    apiKey:            "AIzaSyA8Ge3WFWVJiLEoNJnmlStgThzA70eixAU",
    authDomain:        "unic-elevators-2c01c.firebaseapp.com",
    databaseURL:       "https://unic-elevators-2c01c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "unic-elevators-2c01c",
    storageBucket:     "unic-elevators-2c01c.firebasestorage.app",
    messagingSenderId: "1002807153207",
    appId:             "1:1002807153207:web:a697e2ed1faa95d71165b2"
  });
}

// ✅ ChatGPT approach: single db ref
var db  = firebase.database().ref("tickets");

/* ── STATE ── */
var LANG              = 'en';
var HISTORY           = ['scr-lang'];
var LOGIN_ROLE        = '';
var CURRENT_USER      = '';
var ALL_TICKETS       = [];   // always fresh from Firebase
var ADMIN_TAB         = 'active';
var PROTECTED         = ['scr-tech','scr-admin'];

/* ══════════════════════════════════════════════════════
   ✅ ChatGPT's KEY FIX: db.on("value") real-time listener
   Fires immediately + on every change from any device
   Keeps ALL_TICKETS 100% in sync with Firebase
══════════════════════════════════════════════════════ */
db.on("value", function(snap) {
  ALL_TICKETS = [];
  snap.forEach(function(child) {
    var t    = child.val();
    t._key   = child.key;
    ALL_TICKETS.push(t);
  });
  // Auto re-render whichever staff screen is open
  var active = document.querySelector('.screen.active');
  if (!active) return;
  if (active.id === 'scr-tech')  renderTech();
  if (active.id === 'scr-admin') renderAdmin();
});

/* ── NAVIGATION ── */
function setLang(l) {
  LANG = l;
  gotoScreen('scr-role');
}

function gotoScreen(id) {
  HISTORY.push(id);
  showScreen(id);
}

function navBack() {
  var cur = HISTORY[HISTORY.length - 1];
  if (PROTECTED.indexOf(cur) !== -1) {
    // Logout
    HISTORY = ['scr-lang', 'scr-role'];
    showScreen('scr-role');
    return;
  }
  if (HISTORY.length > 1) {
    HISTORY.pop();
    showScreen(HISTORY[HISTORY.length - 1]);
  }
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) {
    s.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
  var hdr = document.getElementById('main-header');
  var btn = document.getElementById('back-btn');
  hdr.style.display = (id === 'scr-lang') ? 'none' : 'flex';
  btn.textContent   = PROTECTED.indexOf(id) !== -1 ? '🚪 LOGOUT' : '← BACK';
  // Trigger render when entering panel screens
  if (id === 'scr-tech')  renderTech();
  if (id === 'scr-admin') renderAdmin();
  window.scrollTo(0, 0);
}

/* ── LOGIN ── */
function openLogin(role) {
  LOGIN_ROLE = role;
  document.getElementById('login-err').style.display = 'none';
  document.getElementById('login-name').value = '';
  document.getElementById('login-pass').value = '';
  document.getElementById('login-title').innerText =
    role === 'tech' ? '👷 Technician Login' : '🛡️ Admin Login';
  gotoScreen('scr-login');
}

function handleLogin() {
  var n = document.getElementById('login-name').value.trim();
  var p = document.getElementById('login-pass').value;
  if (!n) { alert('Enter your name'); return; }
  var ok = (LOGIN_ROLE === 'tech'  && p === '1111') ||
           (LOGIN_ROLE === 'admin' && p === '2222');
  if (ok) {
    CURRENT_USER = n;
    document.getElementById(LOGIN_ROLE === 'tech' ? 'tech-user-tag' : 'admin-user-tag').innerText = '👤 ' + n;
    HISTORY = ['scr-lang', 'scr-role'];
    gotoScreen('scr-' + LOGIN_ROLE);
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

/* ── RENDER TECHNICIAN LIST ── */
function renderTech() {
  var list   = document.getElementById('tech-list'); if (!list) return;
  var filter = (document.getElementById('tech-filter')  || {}).value || 'active';
  var search = ((document.getElementById('tech-search') || {}).value || '').toLowerCase().trim();
  var now    = Date.now();

  // ✅ Filter: only tickets assigned to THIS technician
  var tickets = ALL_TICKETS.filter(function(t) {
    if (t.assignedTo !== CURRENT_USER) return false;
    if (filter === 'active') return t.status !== 'completed';
    return true;
  });

  if (search) tickets = tickets.filter(function(t) {
    return (t.name  && t.name.toLowerCase().includes(search)) ||
           (t.id    && t.id.toString().includes(search))      ||
           (t.phone && t.phone.includes(search));
  });

  tickets.sort(function(a, b) { return b.created - a.created; });

  if (!tickets.length) {
    list.innerHTML = '<div class="empty">📋 No assignments found</div>';
    return;
  }

  list.innerHTML = tickets.map(function(t) {
    var mapLink = t.lat
      ? '<a href="https://maps.google.com/?q=' + t.lat + ',' + t.lng + '" target="_blank" style="color:var(--blue);font-size:11px">📍 Open Map</a>'
      : '';

    // ✅ ChatGPT: update button calls db.child(key).update()
    var actionBtn = '';
    if (t.status === 'assigned') {
      actionBtn = '<button onclick="updateStatus(\'' + t._key + '\',\'reached\')" ' +
        'style="padding:9px 16px;border-radius:8px;border:none;background:rgba(240,165,0,0.2);color:var(--g);font-weight:700;font-size:13px;cursor:pointer;width:100%;margin-top:10px">✅ Mark as Reached</button>';
    } else if (t.status === 'reached') {
      actionBtn = '<button onclick="updateStatus(\'' + t._key + '\',\'completed\')" ' +
        'style="padding:9px 16px;border-radius:8px;border:none;background:rgba(34,197,94,0.2);color:var(--green);font-weight:700;font-size:13px;cursor:pointer;width:100%;margin-top:10px">🏁 Mark as Completed</button>';
    }

    return '<div class="card" style="border-left:4px solid ' + sColor(t.status) + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +
        '<span style="font-size:11px;color:var(--t2)">ID: <b style="color:var(--g)">#' + t.id + '</b> · ' + tBadge(t.type) + '</span>' +
        '<span class="badge st-' + t.status + '">' + t.status.toUpperCase() + '</span>' +
      '</div>' +
      '<div style="font-weight:700;font-size:16px">' + t.name + '</div>' +
      '<div style="font-size:13px;color:var(--t2);margin:4px 0">📞 ' + t.phone + '</div>' +
      (t.addr  ? '<div style="font-size:12px;color:var(--t2)">📍 ' + t.addr + '</div>' : '') +
      (t.issue ? '<div style="font-size:12px;color:var(--t2);font-style:italic;margin-top:4px">"' + t.issue + '"</div>' : '') +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">' +
        '<span style="font-size:10px;color:var(--t2)">' + new Date(t.created).toLocaleString() + '</span>' + mapLink +
      '</div>' + actionBtn +
    '</div>';
  }).join('');
}

/* ── RENDER ADMIN LIST ── */
function renderAdmin() {
  var list   = document.getElementById('admin-list'); if (!list) return;
  var range  = (document.getElementById('admin-filter')  || {}).value || 'all';
  var search = ((document.getElementById('admin-search') || {}).value || '').toLowerCase().trim();
  var now    = Date.now();

  var base = ALL_TICKETS.filter(function(t) {
    if (range === '7')  return (now - t.created) < 7  * 86400000;
    if (range === '30') return (now - t.created) < 30 * 86400000;
    return true;
  });

  if (search) base = base.filter(function(t) {
    return (t.name  && t.name.toLowerCase().includes(search)) ||
           (t.id    && t.id.toString().includes(search))      ||
           (t.phone && t.phone.includes(search));
  });

  // Update badges
  var aC = base.filter(function(t) { return t.status !== 'completed'; }).length;
  var cC = base.filter(function(t) { return t.status === 'completed'; }).length;
  g('badge-active').innerText    = aC;
  g('badge-completed').innerText = cC;
  g('badge-all').innerText       = base.length;

  // Stats row
  var statsEl = g('admin-stats');
  if (statsEl) {
    var pending = base.filter(function(t) { return t.status === 'pending'; }).length;
    var inprog  = base.filter(function(t) { return t.status === 'assigned' || t.status === 'reached'; }).length;
    statsEl.innerHTML = [
      ['Total',   base.length, '#4285F4'],
      ['Pending', pending,     '#ff6b6b'],
      ['Active',  inprog,      'var(--g)'],
      ['Done',    cC,          'var(--green)']
    ].map(function(x) {
      return '<div style="flex:1;background:var(--n2);border:1px solid var(--br);border-radius:10px;padding:10px;text-align:center">' +
        '<div style="font-size:22px;font-weight:900;color:' + x[2] + '">' + x[1] + '</div>' +
        '<div style="font-size:10px;color:var(--t2)">' + x[0] + '</div>' +
      '</div>';
    }).join('');
  }

  // Apply tab filter
  var tickets = base;
  if (ADMIN_TAB === 'active')    tickets = base.filter(function(t) { return t.status !== 'completed'; });
  if (ADMIN_TAB === 'completed') tickets = base.filter(function(t) { return t.status === 'completed'; });
  tickets.sort(function(a, b) { return b.created - a.created; });

  if (!tickets.length) {
    list.innerHTML = '<div class="empty">📋 No tickets found</div>';
    return;
  }

  list.innerHTML = tickets.map(function(t) {
    var mapLink = t.lat
      ? '<a href="https://maps.google.com/?q=' + t.lat + ',' + t.lng + '" target="_blank" style="color:var(--blue);font-size:11px">📍 Map</a>'
      : '';

    // Assign input (only for pending)
    var assignRow = t.status === 'pending'
      ? '<div style="display:flex;gap:6px;margin-top:10px">' +
          '<input id="asgn-' + t._key + '" placeholder="Enter technician name" ' +
            'style="flex:1;padding:9px;background:var(--n);border:1px solid var(--br);border-radius:6px;color:white;font-size:13px;margin-bottom:0">' +
          '<button onclick="assignTech(\'' + t._key + '\')" ' +
            'style="padding:9px 14px;border-radius:6px;border:none;background:var(--blue);color:white;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap">Assign</button>' +
        '</div>'
      : '<div style="font-size:12px;color:var(--t2);margin-top:6px">👷 Assigned to: <b style="color:white">' + (t.assignedTo || '—') + '</b></div>';

    // Status action buttons for admin
    var statusBtn = '';
    if (t.status === 'assigned') {
      statusBtn = '<button onclick="updateStatus(\'' + t._key + '\',\'reached\')" ' +
        'style="padding:7px 12px;border-radius:6px;border:none;background:rgba(240,165,0,0.2);color:var(--g);font-size:12px;font-weight:700;cursor:pointer">Mark Reached</button> ';
    } else if (t.status === 'reached') {
      statusBtn = '<button onclick="updateStatus(\'' + t._key + '\',\'completed\')" ' +
        'style="padding:7px 12px;border-radius:6px;border:none;background:rgba(34,197,94,0.2);color:var(--green);font-size:12px;font-weight:700;cursor:pointer">Mark Done</button> ';
    }

    return '<div class="card" style="border-left:4px solid ' + sColor(t.status) + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +
        '<span style="font-size:11px;color:var(--t2)">ID: <b style="color:var(--g)">#' + t.id + '</b> · ' + tBadge(t.type) + '</span>' +
        '<span class="badge st-' + t.status + '">' + t.status.toUpperCase() + '</span>' +
      '</div>' +
      '<div style="font-weight:700;font-size:16px">' + t.name + '</div>' +
      '<div style="font-size:13px;color:var(--t2);margin:4px 0">📞 ' + t.phone + '</div>' +
      (t.addr  ? '<div style="font-size:12px;color:var(--t2)">📍 ' + t.addr + '</div>' : '') +
      (t.issue ? '<div style="font-size:12px;color:var(--t2);font-style:italic;margin-top:4px">"' + t.issue + '"</div>' : '') +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">' +
        '<span style="font-size:10px;color:var(--t2)">' + new Date(t.created).toLocaleString() + '</span>' + mapLink +
      '</div>' +
      assignRow +
      '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">' +
        statusBtn +
        '<button onclick="deleteTicket(\'' + t._key + '\')" ' +
          'style="padding:7px 12px;border-radius:6px;border:none;background:rgba(155,17,17,0.2);color:#ff6b6b;font-size:12px;font-weight:700;cursor:pointer">🗑 Delete</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* ── FIREBASE WRITES — ✅ ChatGPT: db.child(key).update() ── */
function updateStatus(key, status) {
  db.child(key).update({ status: status })
    .catch(function(e) { alert('Update failed: ' + e.message); });
}

function assignTech(key) {
  var inp  = document.getElementById('asgn-' + key);
  var name = inp ? inp.value.trim() : '';
  if (!name) { alert('Enter technician name'); return; }
  // ✅ ChatGPT: db.child(key).update()
  db.child(key).update({ assignedTo: name, status: 'assigned' })
    .catch(function(e) { alert('Assign failed: ' + e.message); });
}

function deleteTicket(key) {
  if (!confirm('Delete this ticket? This cannot be undone.')) return;
  db.child(key).remove()
    .catch(function(e) { alert('Delete failed: ' + e.message); });
}

/* ── TAB SWITCH ── */
function switchTab(tab) {
  ADMIN_TAB = tab;
  ['active','completed','all'].forEach(function(t) {
    var el = document.getElementById('tab-' + t);
    if (el) el.classList.toggle('active', t === tab);
  });
  renderAdmin();
}

/* ── HELPERS ── */
function sColor(s) {
  return ({ pending:'rgba(255,255,255,0.3)', assigned:'var(--blue)', reached:'var(--g)', completed:'var(--green)' })[s] || 'var(--br)';
}
function tBadge(type) {
  return ({ installation:'🏗 Install', service:'🔧 Service', emergency:'⚠️ Emergency' })[type] || (type || '');
}
function g(id) { return document.getElementById(id); }
</script>
