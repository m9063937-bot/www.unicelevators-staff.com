<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Unic Elevators – Staff Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Noto+Sans+Telugu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--r:#9B1111;--g:#F0A500;--n:#060d1f;--n2:#0d1628;--tx:#f0f4ff;--t2:#a8b4cf;--br:rgba(255,255,255,0.08);--blue:#4285F4;--green:#22c55e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--n);color:var(--tx);font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden}
.screen{display:none;padding:20px;min-height:100vh}
.screen.active{display:block}
header{padding:15px 20px;background:rgba(6,13,31,0.95);border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.btn-back{background:var(--n2);border:1px solid var(--br);color:var(--tx);padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:20px;color:var(--g);letter-spacing:1px}
.card{background:var(--n2);border:1px solid var(--br);border-radius:16px;padding:20px;margin-bottom:15px}
.btn-main{width:100%;padding:16px;border-radius:12px;border:none;font-weight:700;cursor:pointer;margin-bottom:12px;font-size:16px;transition:.2s}
.btn-primary{background:var(--r);color:white}
.btn-outline{background:var(--n2);color:var(--tx);border:1px solid var(--br)}
input,textarea,select{width:100%;padding:12px;background:var(--n);border:1px solid var(--br);border-radius:8px;color:white;margin-bottom:15px;font-size:16px;font-family:inherit}
select option{background:var(--n2)}
label{font-size:12px;color:var(--t2);display:block;margin-bottom:4px}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:bold;text-transform:uppercase}
.st-pending{background:rgba(255,255,255,0.1);color:white}
.st-assigned{background:rgba(66,133,244,0.2);color:var(--blue)}
.st-reached{background:rgba(240,165,0,0.2);color:var(--g)}
.st-completed{background:rgba(34,197,94,0.2);color:var(--green)}
#loader{position:fixed;inset:0;background:rgba(6,13,31,0.9);display:none;align-items:center;justify-content:center;z-index:2000;flex-direction:column}
.spinner{width:40px;height:40px;border:4px solid var(--g);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-bar{font-size:11px;text-align:center;padding:8px 10px;background:rgba(66,133,244,0.1);color:var(--blue);border-radius:8px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--blue)}
.conn-dot.live{background:var(--green);animation:pulse 2s infinite}
.conn-dot.err{background:#ff6b6b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{flex:1;padding:10px;border-radius:8px;border:1px solid var(--br);background:var(--n2);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:.2s}
.tab.active{background:var(--r);color:white;border-color:var(--r)}
.tab-badge{display:inline-block;background:rgba(255,255,255,0.25);color:inherit;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px;font-weight:900}
.tab.active .tab-badge{background:rgba(255,255,255,0.3)}
.filter-bar{background:var(--n2);border:1px solid var(--br);border-radius:10px;padding:12px;margin-bottom:12px}
.filter-bar label{font-size:11px;color:var(--t2);margin-bottom:4px}
.filter-bar select,.filter-bar input{margin-bottom:0;padding:8px;font-size:13px}
.filter-row{display:flex;gap:8px;align-items:flex-end}
.filter-row>div{flex:1}
.filter-row button{flex-shrink:0;padding:8px 14px;border-radius:8px;border:none;background:var(--blue);color:white;font-weight:700;font-size:12px;cursor:pointer;margin-bottom:0;height:38px}
.search-row{margin-top:10px}
.search-row input{margin-bottom:0;padding:8px 10px;font-size:13px}
.empty{text-align:center;padding:40px 20px;color:var(--t2)}
.empty .icon{font-size:40px;margin-bottom:10px}
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <p style="margin-top:15px;color:var(--g);letter-spacing:2px;font-size:10px" id="loader-msg">LOADING...</p>
</div>

<header id="main-header" style="display:none">
  <button class="btn-back" id="back-btn" onclick="navBack()">← BACK</button>
  <div class="logo">UNIC ELEVATORS</div>
  <div style="width:60px"></div>
</header>

<!-- LANGUAGE -->
<div id="scr-lang" class="screen active">
  <div style="text-align:center;margin-top:80px">
    <div style="font-size:60px;margin-bottom:16px">🔧</div>
    <h1 style="font-size:36px;color:var(--g);font-family:'Barlow Condensed'">UNIC ELEVATORS</h1>
    <p style="color:var(--t2);margin-bottom:8px;font-size:13px">Staff Panel</p>
    <p style="margin-bottom:40px;color:var(--t2)">Choose Language / భాష ఎంచుకోండి</p>
    <button class="btn-main btn-outline" onclick="setLang('en')">🇬🇧 ENGLISH</button>
    <button class="btn-main btn-outline" style="font-family:'Noto Sans Telugu'" onclick="setLang('te')">🇮🇳 తెలుగు</button>
  </div>
</div>

<!-- ROLE -->
<div id="scr-role" class="screen">
  <div style="text-align:center;margin-top:50px">
    <div style="font-size:48px;margin-bottom:12px">🔐</div>
    <h2 id="txt-roleTitle">Staff Login</h2>
    <p style="color:var(--t2);font-size:13px;margin-top:6px;margin-bottom:30px">Select your role to continue</p>
    <button class="btn-main btn-outline" onclick="openLogin('tech')">👷 Technician Login</button>
    <button class="btn-main btn-primary" onclick="openLogin('admin')">🛡️ Admin Panel Login</button>
  </div>
</div>

<!-- LOGIN -->
<div id="scr-login" class="screen">
  <div class="card" style="max-width:400px;margin:40px auto">
    <h2 id="txt-login">Login</h2>
    <div style="margin-top:20px">
      <label>Your Name</label>
      <input type="text" id="login-name" placeholder="Enter your full name">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="Enter password">
      <button class="btn-main btn-primary" onclick="handleLogin()">🔓 Login</button>
      <p id="login-err" style="color:#ff6b6b;text-align:center;display:none;font-size:12px">❌ Incorrect Password. Try again.</p>
    </div>
  </div>
</div>

<!-- TECHNICIAN PANEL -->
<div id="scr-tech" class="screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h3>My Assignments</h3>
    <span id="tech-user-tag" style="font-size:12px;color:var(--g)"></span>
  </div>
  <div class="sync-bar" id="tech-sync-bar">
    <span class="conn-dot" id="tech-dot"></span>
    <span id="tech-sync-text">Connecting to cloud...</span>
  </div>
  <div class="filter-bar">
    <div class="filter-row">
      <div>
        <label>Show tickets from</label>
        <select id="tech-filter-range" onchange="renderTechList()">
          <option value="active">Active Only</option>
          <option value="today">Today</option>
          <option value="7">Last 7 Days</option>
          <option value="30">Last 30 Days</option>
          <option value="all">All Time</option>
        </select>
      </div>
      <button onclick="renderTechList()">🔄 Refresh</button>
    </div>
    <div class="search-row">
      <label>Search by name, ID or phone</label>
      <input type="text" id="tech-search" placeholder="e.g. Ramesh, 99001, 9876543210" oninput="renderTechList()">
    </div>
  </div>
  <div id="tech-list" style="margin-top:5px"></div>
</div>

<!-- ADMIN PANEL -->
<div id="scr-admin" class="screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h3>Admin Control</h3>
    <span id="admin-user-tag" style="font-size:12px;color:var(--g)"></span>
  </div>
  <div class="sync-bar" id="admin-sync-bar">
    <span class="conn-dot" id="admin-dot"></span>
    <span id="admin-sync-text">Connecting to cloud...</span>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-active"    onclick="switchAdminTab('active')">Active    <span class="tab-badge" id="badge-active">0</span></div>
    <div class="tab"        id="tab-completed" onclick="switchAdminTab('completed')">Done   <span class="tab-badge" id="badge-completed">0</span></div>
    <div class="tab"        id="tab-all"       onclick="switchAdminTab('all')">All          <span class="tab-badge" id="badge-all">0</span></div>
  </div>
  <div class="filter-bar">
    <div class="filter-row">
      <div>
        <label>Date range</label>
        <select id="admin-filter-range" onchange="renderAdminList()">
          <option value="7">Last 7 Days</option>
          <option value="30">Last 30 Days</option>
          <option value="all" selected>All Time</option>
        </select>
      </div>
      <button onclick="renderAdminList()">🔄 Refresh</button>
    </div>
    <div class="search-row">
      <label>Search by name, ID or phone</label>
      <input type="text" id="admin-search" placeholder="e.g. Ramesh, 99001, 9876543210" oninput="renderAdminList()">
    </div>
  </div>
  <div id="admin-stats" style="display:flex;gap:8px;margin-bottom:12px"></div>
  <div id="admin-list" style="margin-top:5px"></div>
</div>

<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:            "AIzaSyA8Ge3WFWVJiLEoNJnmlStgThzA70eixAU",
    authDomain:        "unic-elevators-2c01c.firebaseapp.com",
    databaseURL:       "https://unic-elevators-2c01c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "unic-elevators-2c01c",
    storageBucket:     "unic-elevators-2c01c.firebasestorage.app",
    messagingSenderId: "1002807153207",
    appId:             "1:1002807153207:web:a697e2ed1faa95d71165b2"
  });

  var db         = firebase.database();
  var ticketsRef = db.ref('tickets');

  /* STATE */
  var LANG               = 'en';
  var HISTORY            = ['scr-lang'];
  var LOGIN_ROLE         = '';
  var CURRENT_USER_NAME  = '';
  var ALL_TICKETS        = [];
  var ADMIN_TAB          = 'active';
  var PROTECTED          = ['scr-tech', 'scr-admin'];

  /* REAL-TIME LISTENER — fires on every change, updates ALL_TICKETS & re-renders */
  ticketsRef.on('value', function(snapshot) {
    var data = snapshot.val() || {};
    ALL_TICKETS = Object.entries(data).map(function(e) {
      return Object.assign({}, e[1], { _key: e[0] });
    });
    var active = document.querySelector('.screen.active');
    if (!active) return;
    if (active.id === 'scr-tech')  { setSyncBar('tech',  'live', '🟢 Live · ' + ALL_TICKETS.length + ' tickets'); renderTechList(); }
    if (active.id === 'scr-admin') { setSyncBar('admin', 'live', '🟢 Live · ' + ALL_TICKETS.length + ' tickets'); renderAdminList(); }
  });

  /* ── NAVIGATION ── */
  function setLang(l) {
    LANG = l;
    updateText();
    gotoScreen('scr-role');
  }

  function gotoScreen(id) {
    HISTORY.push(id);
    renderScreen(id);
  }

  function navBack() {
    var cur = HISTORY[HISTORY.length - 1];
    if (PROTECTED.indexOf(cur) !== -1) {
      HISTORY = ['scr-lang', 'scr-role'];
      renderScreen('scr-role');
      return;
    }
    if (HISTORY.length > 1) {
      HISTORY.pop();
      renderScreen(HISTORY[HISTORY.length - 1]);
    }
  }

  function renderScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
      s.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
    var hdr = document.getElementById('main-header');
    var btn = document.getElementById('back-btn');
    hdr.style.display = (id === 'scr-lang') ? 'none' : 'flex';
    btn.textContent   = (PROTECTED.indexOf(id) !== -1) ? '🚪 LOGOUT' : '← BACK';
    if (id === 'scr-tech') {
      setSyncBar('tech', 'live', '🟢 Live · ' + ALL_TICKETS.length + ' tickets');
      renderTechList();
    }
    if (id === 'scr-admin') {
      setSyncBar('admin', 'live', '🟢 Live · ' + ALL_TICKETS.length + ' tickets');
      renderAdminList();
    }
    window.scrollTo(0, 0);
  }

  /* ── SYNC BAR ── */
  function setSyncBar(role, state, msg) {
    var dot  = document.getElementById(role + '-dot');
    var text = document.getElementById(role + '-sync-text');
    if (!dot || !text) return;
    dot.className = 'conn-dot' + (state === 'live' ? ' live' : state === 'err' ? ' err' : '');
    text.innerText = msg;
  }

  /* ── LOGIN ── */
  function openLogin(role) {
    LOGIN_ROLE = role;
    document.getElementById('login-err').style.display  = 'none';
    document.getElementById('login-name').value         = '';
    document.getElementById('login-pass').value         = '';
    gotoScreen('scr-login');
  }

  function handleLogin() {
    var n  = document.getElementById('login-name').value.trim();
    var p  = document.getElementById('login-pass').value;
    if (!n) { alert('Enter your name'); return; }
    var ok = (LOGIN_ROLE === 'tech' && p === '1111') || (LOGIN_ROLE === 'admin' && p === '2222');
    if (ok) {
      CURRENT_USER_NAME = n;
      var tag = LOGIN_ROLE === 'tech' ? 'tech-user-tag' : 'admin-user-tag';
      document.getElementById(tag).innerText = '👤 ' + n;
      HISTORY = ['scr-lang', 'scr-role'];
      gotoScreen('scr-' + LOGIN_ROLE);
    } else {
      document.getElementById('login-err').style.display = 'block';
    }
  }

  /* ── RENDER TECH LIST ── */
  function renderTechList() {
    var list   = document.getElementById('tech-list'); if (!list) return;
    var range  = (document.getElementById('tech-filter-range') || {}).value || 'active';
    var search = ((document.getElementById('tech-search') || {}).value || '').toLowerCase().trim();
    var now    = Date.now();

    var tickets = ALL_TICKETS.filter(function(t) {
      if (t.assignedTo !== CURRENT_USER_NAME) return false;
      if (range === 'active') return t.status !== 'completed';
      if (range === 'today')  return (now - t.created) < 86400000;
      if (range === '7')      return (now - t.created) < 7  * 86400000;
      if (range === '30')     return (now - t.created) < 30 * 86400000;
      return true;
    });

    if (search) tickets = tickets.filter(function(t) {
      return (t.name  && t.name.toLowerCase().includes(search)) ||
             (t.id    && t.id.toString().includes(search))      ||
             (t.phone && t.phone.includes(search));
    });

    tickets.sort(function(a, b) { return b.created - a.created; });

    if (!tickets.length) {
      list.innerHTML = '<div class="empty"><div class="icon">📋</div>No assignments found</div>';
      return;
    }

    list.innerHTML = tickets.map(function(t) {
      var mapLink = t.lat
        ? '<a href="https://maps.google.com/?q=' + t.lat + ',' + t.lng + '" target="_blank" style="color:var(--blue);font-size:11px">📍 Map</a>'
        : '';
      var actions = '';
      if (t.status === 'assigned') {
        actions = '<button onclick="updateStatus(\'' + t._key + '\',\'reached\')" style="padding:8px 14px;border-radius:8px;border:none;background:rgba(240,165,0,0.2);color:var(--g);font-weight:700;font-size:12px;cursor:pointer">✅ Mark Reached</button>';
      } else if (t.status === 'reached') {
        actions = '<button onclick="updateStatus(\'' + t._key + '\',\'completed\')" style="padding:8px 14px;border-radius:8px;border:none;background:rgba(34,197,94,0.2);color:var(--green);font-weight:700;font-size:12px;cursor:pointer">🏁 Mark Completed</button>';
      }
      return '<div class="card" style="border-left:3px solid ' + statusColor(t.status) + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +
          '<span style="font-size:11px;color:var(--t2)">ID: <b style="color:var(--g)">#' + t.id + '</b> · ' + typeBadge(t.type) + '</span>' +
          '<span class="badge st-' + t.status + '">' + t.status.toUpperCase() + '</span>' +
        '</div>' +
        '<div style="font-weight:700;font-size:15px">' + t.name + '</div>' +
        '<div style="font-size:12px;color:var(--t2);margin:4px 0">' + t.phone + '</div>' +
        (t.addr  ? '<div style="font-size:11px;color:var(--t2)">' + t.addr + '</div>' : '') +
        (t.issue ? '<div style="font-size:11px;color:var(--t2);margin-top:4px;font-style:italic">"' + t.issue + '"</div>' : '') +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">' +
          '<span style="font-size:10px;color:var(--t2)">' + new Date(t.created).toLocaleString() + '</span>' + mapLink +
        '</div>' +
        (actions ? '<div style="margin-top:10px">' + actions + '</div>' : '') +
      '</div>';
    }).join('');
  }

  /* ── RENDER ADMIN LIST ── */
  function renderAdminList() {
    var list   = document.getElementById('admin-list'); if (!list) return;
    var range  = (document.getElementById('admin-filter-range') || {}).value || 'all';
    var search = ((document.getElementById('admin-search') || {}).value || '').toLowerCase().trim();
    var now    = Date.now();

    var base = ALL_TICKETS.filter(function(t) {
      if (range === '7')  return (now - t.created) < 7  * 86400000;
      if (range === '30') return (now - t.created) < 30 * 86400000;
      return true;
    });

    if (search) base = base.filter(function(t) {
      return (t.name  && t.name.toLowerCase().includes(search)) ||
             (t.id    && t.id.toString().includes(search))      ||
             (t.phone && t.phone.includes(search));
    });

    var aC = base.filter(function(t) { return t.status !== 'completed'; }).length;
    var cC = base.filter(function(t) { return t.status === 'completed'; }).length;
    var el = function(id) { return document.getElementById(id); };
    if (el('badge-active'))    el('badge-active').innerText    = aC;
    if (el('badge-completed')) el('badge-completed').innerText = cC;
    if (el('badge-all'))       el('badge-all').innerText       = base.length;

    var statsEl = el('admin-stats');
    if (statsEl) {
      var pending = base.filter(function(t) { return t.status === 'pending'; }).length;
      var inprog  = base.filter(function(t) { return t.status === 'assigned' || t.status === 'reached'; }).length;
      statsEl.innerHTML = [
        ['Total', base.length, '#4285F4'],
        ['Pending', pending,   '#ff6b6b'],
        ['Active',  inprog,    'var(--g)'],
        ['Done',    cC,        'var(--green)']
      ].map(function(x) {
        return '<div style="flex:1;background:var(--n2);border:1px solid var(--br);border-radius:10px;padding:10px;text-align:center">' +
          '<div style="font-size:20px;font-weight:900;color:' + x[2] + '">' + x[1] + '</div>' +
          '<div style="font-size:10px;color:var(--t2)">' + x[0] + '</div>' +
        '</div>';
      }).join('');
    }

    var tickets = base;
    if (ADMIN_TAB === 'active')    tickets = base.filter(function(t) { return t.status !== 'completed'; });
    if (ADMIN_TAB === 'completed') tickets = base.filter(function(t) { return t.status === 'completed'; });
    tickets.sort(function(a, b) { return b.created - a.created; });

    if (!tickets.length) {
      list.innerHTML = '<div class="empty"><div class="icon">📋</div>No tickets found</div>';
      return;
    }

    list.innerHTML = tickets.map(function(t) {
      var mapLink = t.lat
        ? '<a href="https://maps.google.com/?q=' + t.lat + ',' + t.lng + '" target="_blank" style="color:var(--blue);font-size:11px">📍 Map</a>'
        : '';
      var assignSection = t.status === 'pending'
        ? '<div style="display:flex;gap:6px;margin-top:10px">' +
            '<input id="asgn-' + t._key + '" placeholder="Technician name" style="flex:1;padding:8px;background:var(--n);border:1px solid var(--br);border-radius:6px;color:white;font-size:12px;margin-bottom:0">' +
            '<button onclick="assignTech(\'' + t._key + '\')" style="padding:8px 12px;border-radius:6px;border:none;background:var(--blue);color:white;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap">Assign</button>' +
          '</div>'
        : '<div style="font-size:11px;color:var(--t2);margin-top:6px">👷 Assigned: <b style="color:white">' + (t.assignedTo || '—') + '</b></div>';
      var statusBtns = '';
      if (t.status === 'assigned') {
        statusBtns = '<button onclick="updateStatus(\'' + t._key + '\',\'reached\')" style="padding:6px 10px;border-radius:6px;border:none;background:rgba(240,165,0,0.2);color:var(--g);font-size:11px;font-weight:700;cursor:pointer">Mark Reached</button>';
      } else if (t.status === 'reached') {
        statusBtns = '<button onclick="updateStatus(\'' + t._key + '\',\'completed\')" style="padding:6px 10px;border-radius:6px;border:none;background:rgba(34,197,94,0.2);color:var(--green);font-size:11px;font-weight:700;cursor:pointer">Mark Completed</button>';
      }
      return '<div class="card" style="border-left:3px solid ' + statusColor(t.status) + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">' +
          '<span style="font-size:11px;color:var(--t2)">ID: <b style="color:var(--g)">#' + t.id + '</b> · ' + typeBadge(t.type) + '</span>' +
          '<span class="badge st-' + t.status + '">' + t.status.toUpperCase() + '</span>' +
        '</div>' +
        '<div style="font-weight:700;font-size:15px">' + t.name + '</div>' +
        '<div style="font-size:12px;color:var(--t2);margin:4px 0">' + t.phone + '</div>' +
        (t.addr  ? '<div style="font-size:11px;color:var(--t2)">' + t.addr + '</div>' : '') +
        (t.issue ? '<div style="font-size:11px;color:var(--t2);font-style:italic;margin-top:4px">"' + t.issue + '"</div>' : '') +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">' +
          '<span style="font-size:10px;color:var(--t2)">' + new Date(t.created).toLocaleString() + '</span>' + mapLink +
        '</div>' +
        assignSection +
        '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">' +
          statusBtns +
          '<button onclick="deleteTicket(\'' + t._key + '\')" style="padding:6px 10px;border-radius:6px;border:none;background:rgba(155,17,17,0.2);color:#ff6b6b;font-size:11px;font-weight:700;cursor:pointer">🗑 Delete</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* ── FIREBASE WRITES ── */
  function updateStatus(fbKey, newStatus) {
    db.ref('tickets/' + fbKey).update({ status: newStatus })
      .catch(function(e) { alert('Update failed: ' + e.message); });
  }

  function assignTech(fbKey) {
    var inp  = document.getElementById('asgn-' + fbKey);
    var name = inp ? inp.value.trim() : '';
    if (!name) { alert('Enter technician name'); return; }
    db.ref('tickets/' + fbKey).update({ assignedTo: name, status: 'assigned' })
      .catch(function(e) { alert('Assign failed: ' + e.message); });
  }

  function deleteTicket(fbKey) {
    if (!confirm('Delete this ticket? Cannot be undone.')) return;
    db.ref('tickets/' + fbKey).remove()
      .catch(function(e) { alert('Delete failed: ' + e.message); });
  }

  /* ── TAB SWITCH ── */
  function switchAdminTab(tab) {
    ADMIN_TAB = tab;
    ['active','completed','all'].forEach(function(t) {
      var el = document.getElementById('tab-' + t);
      if (el) el.classList.toggle('active', t === tab);
    });
    renderAdminList();
  }

  /* ── HELPERS ── */
  function statusColor(s) {
    return ({ pending:'rgba(255,255,255,0.3)', assigned:'var(--blue)', reached:'var(--g)', completed:'var(--green)' })[s] || 'var(--br)';
  }
  function typeBadge(type) {
    return ({ installation:'🏗 Install', service:'🔧 Service', emergency:'⚠️ Emergency' })[type] || type;
  }
  function updateText() {
    var map = { en: { roleTitle:'Staff Login', login:'Login' }, te: { roleTitle:'స్టాఫ్ లాగిన్', login:'లాగిన్' } };
    var t   = map[LANG];
    function s(id, v) { var e = document.getElementById(id); if (e) e.innerText = v; }
    s('txt-roleTitle', t.roleTitle);
    s('txt-login',     t.login);
  }
</script>
</body>
</html>
